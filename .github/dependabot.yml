# Dependabot keeps the SHA-pinned actions in ci.yml current. Pinning to a SHA
# is what makes a supply-chain compromise of an action's tag a non-event; this
# is what stops that pinning turning into rot.
#
# Cargo is deliberately absent. The library has zero runtime dependencies, and
# `loom` is a dev-dependency gated on `--cfg loom` that Dependabot cannot
# resolve anyway. A dependency PR here would mean something changed that
# deserves a human decision, not an automated bump -- deny.toml enforces that.
#
# Note that CI is manual-dispatch only, so nothing runs automatically on a
# Dependabot PR. `./scripts/ci.sh` is NOT the check to run here -- it never
# invokes an action, so it cannot tell you whether a bump works. Two things
# actually validate one:
#
#   1. Verify the SHA resolves to the tag named in the comment, rather than
#      trusting the comment. Pinning is only worth anything if someone checks:
#        gh api repos/<owner>/<action>/git/ref/tags/<tag> --jq .object.sha
#   2. Merge, then dispatch the workflow and confirm it is green:
#        gh workflow run ci.yml --ref master
#
# Read the release notes for a major bump before merging it. actions/checkout
# v4 -> v7 crossed three majors (Node 24 and a minimum runner version, changed
# credential persistence, fork-PR checkout blocked for pull_request_target and
# workflow_run); none of it applied here only because every `uses:` in ci.yml
# is bare, with no inputs at all.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
