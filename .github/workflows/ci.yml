# Remote CI does not run automatically -- local CI is primary.
#
# Run the same matrix locally before opening a PR:
#   ./scripts/ci.ps1     (Windows)
#   ./scripts/ci.sh      (POSIX)
#
# workflow_dispatch keeps these jobs available for optional manual runs.
#
# Note on toolchains: rust-toolchain.toml pins 1.92.0 and overrides whatever
# a setup action installs, so a bare `cargo` here runs the MSRV regardless of
# the `toolchain:` input. Jobs that need a different compiler say so with an
# explicit `cargo +stable`, which does take precedence.
name: CI

on:
  workflow_dispatch:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Runs the MSRV (1.92.0) via rust-toolchain.toml, not stable.
  test-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run tests on the pinned MSRV
        run: cargo test --verbose

  # Without this job nothing would exercise current stable, since the pin
  # applies everywhere else.
  test-stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Run tests on stable
        run: cargo +stable test --verbose
      - name: Clippy on stable
        run: cargo +stable clippy --all-targets -- -D warnings

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Run clippy on the pinned MSRV
        run: cargo clippy --all-targets -- -D warnings

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check advisories, licences, bans, sources
        uses: EmbarkStudios/cargo-deny-action@v2

  # `--all-features` cannot work for this crate: the two portable-atomic
  # backend features are mutually exclusive. Enumerate instead of sweeping.
  features:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["", "portable-atomic", "portable-atomic-critical-section"]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check features "${{ matrix.features }}"
        run: |
          if [ -n "${{ matrix.features }}" ]; then
            cargo check --features "${{ matrix.features }}"
          else
            cargo check
          fi

  embedded:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: thumbv6m-none-eabi
            features: portable-atomic-unsafe-assume-single-core
          - target: thumbv7em-none-eabi
            features: ""
          - target: riscv32imac-unknown-none-elf
            features: ""
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (target ${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check ${{ matrix.target }}
        run: |
          if [ -n "${{ matrix.features }}" ]; then
            cargo check --target ${{ matrix.target }} --features "${{ matrix.features }}"
          else
            cargo check --target ${{ matrix.target }}
          fi
