# Remote CI runs on every push to master / release branches and on every PR.
#
# It is necessary but NOT sufficient. These jobs are a subset of the local
# matrix -- coverage, Miri, and Loom are not here, because they are slow and
# because a green x86 run is weak evidence for the lock-free types anyway. A
# green check means "nothing obvious is broken", not "this is ready to release".
# Before opening a PR, and always before a release, run the full local matrix:
#
#   ./scripts/ci.ps1     (Windows)      ./scripts/ci.sh      (POSIX)
#   ./scripts/miri.ps1                  ./scripts/miri.sh
#   ./scripts/loom.ps1                  ./scripts/loom.sh
#
# Note on toolchains: rust-toolchain.toml pins 1.92.0 and overrides whatever
# a setup action installs, so a bare `cargo` here runs the MSRV regardless of
# the `toolchain:` input. Jobs that need a different compiler say so with an
# explicit `cargo +stable`, which does take precedence.
name: CI

on:
  push:
    branches:
      - master
      - 'release/**'
  pull_request:
  workflow_dispatch:

# A new push to a PR makes the in-flight run for that PR obsolete. Cancel it
# rather than paying for both. Never cancel on master or a release branch --
# those runs are the record of whether a merged commit is good.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

# Actions are pinned to commit SHAs, not tags. A tag can be repointed at new
# code by whoever controls the action's repository; a SHA cannot. Dependabot
# (.github/dependabot.yml) proposes the bumps, so pinning does not mean going
# stale -- the trailing comment records which version each SHA is.

env:
  CARGO_TERM_COLOR: always

jobs:
  # The single job branch protection should require. Everything else is a
  # dependency of it.
  #
  # Requiring the individual jobs instead would mean naming matrix legs like
  # `embedded (thumbv6m-none-eabi, portable-atomic-unsafe-assume-single-core)`
  # in repository settings. Change the matrix and the required name no longer
  # matches anything, so the check never reports and every PR waits forever on
  # a job that will never run -- a failure mode that looks like GitHub being
  # broken rather than like a stale setting.
  #
  # `if: always()` is load-bearing. Without it this job is skipped when a
  # dependency fails, a skipped required check never reports, and the PR hangs
  # instead of showing red.
  ci:
    if: always()
    needs: [fmt, doc, test-msrv, test-stable, clippy, deny, features, embedded]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "One or more CI jobs did not succeed:"
          echo '${{ toJSON(needs) }}'
          exit 1

  # Cheap and deterministic, so there is no reason for these to be local-only.
  # Without them a green check would sit next to unformatted code or a broken
  # doc link, both of which `scripts/ci.*` rejects.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (rustfmt)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Build docs, warnings are errors
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # Runs the MSRV (1.92.0) via rust-toolchain.toml, not stable.
  test-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Run tests on the pinned MSRV
        run: cargo test --verbose

  # Without this job nothing would exercise current stable, since the pin
  # applies everywhere else.
  test-stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - name: Run tests on stable
        run: cargo +stable test --verbose
      - name: Clippy on stable
        run: cargo +stable clippy --all-targets -- -D warnings

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (clippy)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - name: Run clippy on the pinned MSRV
        run: cargo clippy --all-targets -- -D warnings

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check advisories, licences, bans, sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  # `--all-features` cannot work for this crate: the two portable-atomic
  # backend features are mutually exclusive. Enumerate instead of sweeping.
  features:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["", "portable-atomic", "portable-atomic-critical-section"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Check features "${{ matrix.features }}"
        run: |
          if [ -n "${{ matrix.features }}" ]; then
            cargo check --features "${{ matrix.features }}"
          else
            cargo check
          fi

  embedded:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: thumbv6m-none-eabi
            features: portable-atomic-unsafe-assume-single-core
          - target: thumbv7em-none-eabi
            features: ""
          - target: riscv32imac-unknown-none-elf
            features: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (target ${{ matrix.target }})
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - name: Check ${{ matrix.target }}
        run: |
          if [ -n "${{ matrix.features }}" ]; then
            cargo check --target ${{ matrix.target }} --features "${{ matrix.features }}"
          else
            cargo check --target ${{ matrix.target }}
          fi
