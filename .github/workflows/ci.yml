# Remote CI is intentionally inactive.
# Prefer local verification:
#   cargo test
#   cargo check --target thumbv7em-none-eabi
#   cargo check --target thumbv6m-none-eabi --features portable-atomic-unsafe-assume-single-core
#   cargo clippy --all-targets -- -D warnings
#   cargo fmt --all -- --check
#
# workflow_dispatch keeps the file for optional manual runs only.
name: CI

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Run tests
        run: cargo test --verbose
