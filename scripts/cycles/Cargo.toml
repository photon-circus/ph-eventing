# Cycle-cost probe. Runs under QEMU with instruction counting so the numbers are
# deterministic. Its own workspace, like scripts/codesize, so the root package
# keeps reporting zero dependencies.
[workspace]

[package]
name = "ph-eventing-cycles"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
# _cycles-probe: hidden probe-only feature exposing the seeding constructor so
# the saturated `increment` arm is a measured region (see src/main.rs).
ph-eventing = { path = "../..", features = ["_cycles-probe"] }
cortex-m = "0.7"
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.5"

[features]
# Isolate the large-payload completion/publication matrix from the standard
# hot-path probe so adding matrix rows cannot perturb its LTO decisions.
block-matrix = []
# Keep the larger LatestBuf payload matrix out of the standing probe so its
# stack use and marker set remain independent.
latest-matrix = []
# Keep the larger cross-lane sample/block matrix isolated as well.
latest-block-matrix = []

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
debug = true
